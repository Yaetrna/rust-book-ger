[[questions]]
id = "5ae11501-25d9-4b94-8e88-aa1c2122779f"
type = "MultipleChoice"
prompt.prompt = """
Wahr oder falsch: Diese beiden Codestücke ergeben beim Ausführen denselben Wert für `x`.

Codeausschnitt 1:
```
let x = if cond { 1 } else { 2 };
```

Codeausschnitt 2:
```
let x;
if cond {
  x = 1;
} else {
  x = 2;
}
```

(Hinweis: Beide Codeausschnitte lassen sich kompilieren!)
"""
answer.answer = "Wahr"
prompt.distractors = [ "Falsch" ]
context = """
Der erste if-Ausdruck ist eine knappere Form, das Verhalten der zweiten if-Anweisung auszudrücken.

Beachte, dass Rust im zweiten Codeausschnitt **nicht** verlangt, dass `x` anfangs mit `let mut` deklariert wird.
Das liegt daran, dass Rust erkennen kann, dass `x` nur ein einziges Mal etwas zugewiesen wird, da immer nur ein Zweig der 
if-Anweisung ausgeführt wird.
"""

[[questions]]
id = "4e07358c-b318-49cb-8210-fbed7ed50e23"
type = "Tracing"
prompt.program = """
fn main() {
  let x = 1;
  let y = if x { 0 } else { 1 }; 
  println!("{y}");
}
"""
answer.doesCompile = false
answer.lineNumber = 3
context = """
Die Bedingung eines if-Ausdrucks muss ein boolescher Wert sein. Rust kennt kein Konzept von „truthy“- oder „falsy“-Werten.
"""