id = "fb0e3080-7cc8-4338-948e-fae693d137c8"
type = "MultipleChoice"
prompt.prompt = """
**Programm 2:**

```ide
/// Reverses the elements of a vector in-place
fn reverse(v: &mut Vec<String>) {
    let n = v.len();
    for i in 0 .. n / 2 {
        std::mem::swap(&mut v[i], &mut v[n - i - 1]);
    }
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieses Programms bekommen würdest?
"""
answer.answer = "cannot borrow `v` as mutable twice for `v[i]` and `v[n - i - 1]`"
prompt.distractors = [
  "cannot borrow `v` as immutable for `v.len()` when `v` is a mutable borrow",
  "cannot mutably borrow an element `v[i]` of a mutable vector"
]
context = """
Der Compiler berücksichtigt nicht die konkreten Werte der Indizes, mit denen auf ein Array zugegriffen wird. Daher wird angenommen, dass `&mut v[i]`
und `&mut v[n - i - 1]` möglicherweise auf dasselbe Element verweisen. Deshalb bekommen wir einen Fehler,
dass `v` nicht zweimal veränderlich ausgeliehen werden kann.
"""


