Wenn der Borrow-Checker eine Operation zurückweist, die eigentlich sicher ist, und es keine Umgehungsmöglichkeit gibt,
ist unsicherer Code manchmal akzeptabel, wenn es entscheidend ist, Allokationen zu vermeiden. 
In diesem konkreten Fall solltest du eigentlich [`Vec::swap`](https://doc.rust-lang.org/std/vec/struct.Vec.html#method.swap) verwenden, das intern
mit gründlich getestetem `unsafe`-Code implementiert ist, ähnlich dem Code oben. 
Aber allgemein gilt: Wenn die Standardbibliothek deinen Anwendungsfall nicht unterstützt, kann `unsafe` akzeptabel sein, sofern es korrekt verwendet wird.
