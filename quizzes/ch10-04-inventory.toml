context = """
Wird die Definition von `get_curve` in `apply_curve` eingesetzt (Inlining), versteht der Borrow-Checker, dass `self.curve` nicht `self.scores` ist,
und lässt die Funktion kompilieren. Das ist eine gängige Umgehung für diese Art von Einschränkung des Borrow-Checkers.

Eine andere Möglichkeit ist, auszunutzen, dass sich `self.curve` billig kopieren lässt, und [`Option::copied`](https://doc.rust-lang.org/std/option/enum.Option.html#method.copied) zu verwenden, 
was die Ausleihe von `self` aufhebt, sobald `.copied()` aufgerufen wird.
