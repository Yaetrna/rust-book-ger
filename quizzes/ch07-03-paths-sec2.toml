[[questions]]
id = "8ef2f170-71d9-4f17-a688-b99d8c8072a8"
type = "Tracing"
prompt.program = """
pub mod a {
  pub mod b {
    pub fn f() { println!("b1"); }
    pub mod c {
      pub fn f() { println!("c1"); }
    }
  }
  pub fn entry() { super::b::c::f(); }
}

pub mod b {
  pub fn f() { println!("b2"); }
  pub mod c {
    pub fn f() { println!("c2"); }
  }
}

fn main() {
  crate::a::entry();
}
"""
answer.doesCompile = true
answer.stdout = "c2"
context = """
`entry` verwendet den Pfad `super::b::c::f`. `entry` liegt im Modul `a`, also verweist `super` auf das Elternmodul von `a`, also die Wurzel des Crates. 
Das Kind `b` der Wurzel ist dann das äußerste Modul `b`, dessen Kind `c` eine Funktion `f` enthält, die `"c2"` ausgibt.
"""

