[[questions]]
id = "cbe8ef63-4f7e-45fd-b11f-e6eba40587b0"
type = "MultipleChoice"
prompt.prompt = """
Welche der folgenden Aussagen erklärt am besten, warum ein `i32` ohne Move kopiert werden kann, ein `String` aber nicht?
"""
answer.answer = "Ein `String` besitzt Daten auf dem Heap, ein `i32` dagegen nicht"
prompt.distractors = [
    "Ein `i32` belegt weniger Speicher als ein `String`",
    "Ein `i32` ist in Rust ein primitiver Typ, ein `String` dagegen nicht",
