type = "MultipleChoice"
prompt.prompt = """
Die Funktion `extract` wird vom Borrow-Checker zurückgewiesen:

```rust
fn extract(b: &Box<i32>) -> i32 {
    let b2: Box<i32> = *b;
    *b2
}
```

Stell dir vor, der Borrow-Checker würde diese Funktion nicht zurückweisen. 
Bestimme, ob es eine Eingabe gibt, bei der die Funktion undefiniertes Verhalten verursachen würde, wenn sie mit dieser Eingabe ausgeführt wird.
"""
answer.answer = "Diese Funktion KÖNNTE undefiniertes Verhalten verursachen"
prompt.distractors = ["Diese Funktion könnte KEIN undefiniertes Verhalten verursachen"]
context = """
Diese Funktion würde bei jeder Eingabe einen Double-Free verursachen.
"""


