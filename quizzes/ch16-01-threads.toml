[[questions]]
id = "53cb3740-2962-4379-a25f-a65e72812a95"
type = "Tracing"
prompt.program = """
use std::thread;
fn main() {
    let mut n = 1;
    let t = thread::spawn(move || {
        n = n + 1;
        thread::spawn(move || {
            n = n + 1;
        })
    });
    n = n + 1;
    t.join().unwrap().join().unwrap();
    println!("{n}");
}
"""
answer.doesCompile = true
answer.stdout = "2"
context = """
Das Schlüsselwort `move` sorgt dafür, dass `n` in die Closure kopiert wird, daher haben die Zuweisungen
`n = n + 1` innerhalb von `thread::spawn` keine Auswirkung auf das äußere `n`.
"""

[[questions]]
id = "c2a84e6d-8143-4944-bf20-b00e49144ac9"
type = "MultipleChoice"
prompt.prompt = """
Betrachte dieses Beispiel aus dem Text, in dem ein Thread einen Vektor unzulässig erfasst:

```
use std::thread;

fn main() {
    let v = vec![1, 2, 3];

    let handle = thread::spawn(|| {
        println!("Here's a vector: {:?}", v);
    });

    handle.join().unwrap();
}
```

Der Rust-Compiler gibt dabei diese Diagnose aus:

```text
note: function requires argument type to outlive `'static`
 --> src/main.rs:6:18
  |
6 |       let handle = thread::spawn(|| {
  |  __________________^
7 | |         println!("Here's a vector: {:?}", v);
8 | |     });
  | |______^
```

Erinnere dich, dass `'static` die Lifetime von Referenzen ist, die während der gesamten Laufzeit des Programms gültig sind.

Was beschreibt den Hinweis „function requires argument type to outlive `'static`“ am besten?
"""
answer.answer = "Rust weiß nicht, wie lange ein Thread läuft, daher müssen die vom Thread erfassten Werte ewig leben"
prompt.distractors = [
    "Die an `thread::spawn` übergebene Closure darf keine Argumente nehmen",
    "Der Vektor `v` enthält Werte, die `'static` nicht überleben",
    "Eine Closure darf nur String-Konstanten vom Typ `&'static str` erfassen"
]
context = """
Erfasst eine Closure eine Referenz auf einen Wert, der kürzer als `'static` lebt, könnte der Thread länger leben 
als der Wert und die Speichersicherheit verletzen. Beachte, dass sich mit [`thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html) 
nicht statische Referenzen in Threads erfassen lassen, indem die Lifetime des Threads statisch begrenzt wird.
"""