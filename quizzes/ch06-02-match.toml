[[questions]]
id = "6e012d34-5c59-443e-85d9-385f0d7dee13"
type = "MultipleChoice"
prompt.prompt = """
Betrachte diese beiden Implementierungen einer Funktion, die eine vorzeichenlose Zahl zweimal dekrementiert.

```
fn decr_twice_v1(n: u32) -> Option<u32> {
  match n {
    0 => None,
    1 => None,
    n2 => Some(n2 - 2)
  }
}

fn decr_twice_v2(n: u32) -> Option<u32> {
  if n == 0 {
    None
  } else if n == 1 {
    None
  } else {
    Some(n - 2)
  }
}
```

Die Funktionen verhalten sich gleich für:
"""
answer.answer = "Alle Eingaben"
prompt.distractors = [ "Keine Eingaben", "Einige, aber nicht alle Eingaben" ]
context = """
`match` und `if` erfüllen hier dieselbe Funktion. Ein Match-Ausdruck ist wie ein spezialisiertes `if`, das auf Gleichheit mit dem verglichenen Objekt prüft.
"""