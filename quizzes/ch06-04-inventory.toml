id = "815ae4cd-0f23-4da5-9dc2-0e81c664cc28"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Makes a string to separate lines of text, 
/// returning a default if the provided string is blank
fn make_separator(user_str: &str) -> &str {
    if user_str == "" {
        let default = "=".repeat(10);
        &default
    } else {
        user_str
    }
}
```

Welche der folgenden Korrekturen (gelb hervorgehoben) erfüllt diese drei Kriterien am besten:
1. Die korrigierte Funktion besteht den Rust-Compiler,
2. die korrigierte Funktion bewahrt die Absicht des ursprünglichen Codes und
3. die korrigierte Funktion führt keine unnötigen Ineffizienzen ein?
"""
answer.answer = """
```ide
fn make_separator(user_str: &str) -> `[String]` {
    if user_str == "" {
        let default = "=".repeat(10);
        `[default]`
    } else {
        `[user_str.to_string()]`        
    }
}
```
"""
prompt.distractors = [
"""
```ide
fn make_separator(user_str: &str) -> &str {
    if user_str == "" {
        let default = "=".repeat(10);
        &default
    } else {
        `[&user_str]`
    }
}
```
""",
"""
```ide
fn make_separator(user_str: `[String]`) -> `[String]` {
    if user_str == "" {
        let default = "=".repeat(10);
        `[default]`
    } else {
        user_str
    }
}
```
""",
]
context = """
Es gibt keine gültige Möglichkeit, einen Zeiger auf eine auf dem Stack allozierte Variable zurückzugeben. Die einfache Lösung ist daher, den Rückgabetyp in `String` zu ändern
und die Eingabe `user_str` in einen String zu kopieren, der seine Daten besitzt. Würde man aber verlangen, dass `user_str` ein `String` ist, würde die API unflexibler, z. B.
könnte eine aufrufende Stelle `make_separator` nicht mit einem Teilstring eines größeren Strings aufrufen. Außerdem müssten aufrufende Stellen Strings auf dem Heap allozieren, z. B.
könnten sie kein String-Literal wie in `make_separator("Rust")` verwenden.

Die idiomatischste Lösung für dieses Problem verwendet ein Konstrukt, das du noch nicht kennst: [`Cow`](https://doc.rust-lang.org/std/borrow/enum.Cow.html).
Dieser Smart-Pointer mit Clone-on-Write würde es der Funktion ermöglichen, ohne Typfehler *entweder* einen String mit eigenen Daten *oder* eine String-Referenz zurückzugeben.
"""

