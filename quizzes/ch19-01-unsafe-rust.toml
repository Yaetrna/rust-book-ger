[[questions]]
id = "05a7959b-4fe7-4ee6-9c25-bfa9a4e72535"
type = "MultipleChoice"
prompt.prompt = """
Welche der folgenden „Superkräfte“ ermöglicht Rust innerhalb eines `unsafe`-Blocks?
"""
answer.answer = [
    "Einen Raw-Pointer dereferenzieren",
    "Eine als `unsafe` gekennzeichnete Funktion aufrufen",
]
prompt.distractors = [
    "Den Borrow-Checker abschalten",
    "Eine Referenz in einen Raw-Pointer umwandeln",
]
context = """
Mit `unsafe`-Blöcken kannst du Raw-Pointer dereferenzieren und `unsafe`-Funktionen aufrufen. `unsafe`
schaltet den Borrow-Checker jedoch nicht ab (Operationen auf sicheren Referenzen werden weiterhin geprüft).
Eine Referenz kann in normalem, sicherem Code in einen Raw-Pointer umgewandelt werden.
"""


[[questions]]
id = "7d50567d-d73c-47d4-922f-480e8d1b7919"
type = "Tracing"
prompt.program = """
fn main() {
    let mut v = Vec::with_capacity(4);
    for i in 0 .. 3 { 
        v.push(i); 
    }
    let n = &raw const v[0];
    v.push(4);
    println!("{}", unsafe { *n });
}
"""
answer.doesCompile = true
answer.stdout = "0"
context = """
Dieses Programm ist gefährlich! Es kompiliert korrekt und läuft ohne Probleme,
weil der `Vec` genug Kapazität hat, sodass `v.push(4)` seine Größe nicht ändert. Wäre
die Kapazität jedoch 3, würde `n` auf freigegebenen Speicher zeigen.
"""

[[questions]]
id = "015941ed-d375-4070-a8dc-2f368584b302"
type = "MultipleChoice"
prompt.prompt = """
In welchen der folgenden Situationen ist die Verwendung von `unsafe`-Code (oder eines sicheren Wrappers um `unsafe`-Code)
eine idiomatische Methode, um den Borrow-Checker zu umgehen?
"""
answer.answer = [    
    "Zwei veränderliche Referenzen auf disjunkte Indizes in einem Array erhalten",
    "Erlauben, dass Werte uninitialisiert sind, solange sie nicht gelesen werden",
    "Eine Referenz auf ein Feld eines Structs in einem anderen Feld desselben Structs speichern"
]
prompt.distractors = [
    "Einen Zeiger auf eine auf dem Stack allozierte Variable aus einer Funktion zurückgeben",    
]
context = """
Zwei veränderliche Referenzen auf disjunkte Indizes sind sinnvoll, weil der Borrow-Checker nicht versteht, wann Indizes disjunkt sind. Siehe: [`slice::split_at_mut`](https://doc.rust-lang.org/stable/std/primitive.slice.html#method.split_at_mut).

Uninitialisierte Werte zu erlauben, ist sinnvoll, weil der Borrow-Checker konservativ davon ausgeht, dass Werte immer initialisiert sein müssen, es aber manchmal nützlich ist, mit uninitialisierten Werten zu arbeiten. Siehe [`MaybeUninit`](https://doc.rust-lang.org/stable/std/mem/union.MaybeUninit.html) und den Crate [`take_mut`](https://docs.rs/take_mut/0.2.2/take_mut/index.html).

Ein Struct eine Referenz auf sich selbst halten zu lassen, ist sinnvoll, weil der Borrow-Checker
nicht über die Lifetime von Selbstreferenzen urteilen kann. Siehe das Modul [`std::pin`](https://doc.rust-lang.org/stable/std/pin/index.html).

Einen Zeiger auf eine auf dem Stack allozierte Variable zurückzugeben, ist dagegen mit unsicherem Code *nie*
gültig. Der einzige angemessene Workaround ist eine Form der Speicherbereinigung (*garbage collection*), z. B. ein `Rc<T>`
statt `&T` zurückzugeben.
"""