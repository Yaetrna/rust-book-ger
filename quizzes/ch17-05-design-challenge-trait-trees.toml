[multipart]
q = """
**Kontext:** Du entwirfst ein einfaches Framework für Benutzeroberflächen, das aus einem Baum von Widgets wie Text und Schaltflächen besteht.

**Funktionalität:** Die API stellt einen Trait `Widget` bereit, der festlegt, wie ein Widget funktioniert. Der Nutzer der API implementiert den Trait `Widget` und ruft ihn auf, um eine Benutzeroberfläche darzustellen.

**Designs:** Unten stehen mehrere vorgeschlagene Designs, um die Funktionalität zu implementieren.

```
// Option 1: children must be Self
pub trait Widget: Sized {
	fn render(&self) -> Vec<Self>;
}

// Option 2: children are a trait parameter
pub trait Widget<Children> {
	fn render(&self) -> Vec<Children>;
}

// Option 3: children are an associated type
pub trait Widget {
	type Children: Widget;
	fn render(&self) -> Vec<Self::Children>;
}

// Option 4: children are a reference trait object
pub trait Widget {
	fn render(&self) -> Vec<&dyn Widget>;
}

// Option 5: children are a boxed trait object
pub trait Widget {
	fn render(&self) -> Vec<Box<dyn Widget>>;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:** Vom Nutzer der API wird erwartet, ein einziges Enum `WidgetImpl` bereitzustellen, das alle möglichen Widgets darstellt, und den Trait `Widget` für `WidgetImpl` zu implementieren.
"""
prompt.distractors = ["2", "3", "4", "5"]
prompt.sortAnswers = true
answer.answer = ["1"]
context = """
Wenn wir alle möglichen Widgets als ein einziges Enum darstellen, etwa so:

```
enum WidgetImpl {
  Button { /* .. */ },
  Text { /* .. */ },
  // ..
}

impl Widget for WidgetImpl { /* .. */ }
```

Dann haben wir ein System mit „geschlossener Welt“, in dem es eine nicht erweiterbare Menge möglicher Widgets gibt. Es gibt nur eine Implementierung von `Widget` und keinen Bedarf für dynamischen Dispatch.
Daher ist nur Option 1 sinnvoll, weil `render` immer nur andere `WidgetImpl`-Typen zurückgeben würde. Alle anderen Designs enthalten unter dieser Anforderung unnötige Komplexität.
"""
id = "e529cabf-a14c-4f1b-865f-1f376b704df8"

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:** Vom Nutzer der API wird erwartet, für jedes mögliche Widget ein eigenes Struct bereitzustellen und den Trait `Widget` für jedes Struct zu implementieren.
Jedes Widget kann einen Vektor zurückgeben, der Widgets beliebiger Typen enthält.
"""
prompt.distractors = ["1", "2", "3"]
prompt.sortAnswers = true
answer.answer = ["4", "5"]
context = """
Anders als bei der vorherigen Frage erwarten wir jetzt für jedes Widget einen eigenen Typ, etwa:

```
struct Button { /* .. */ }
impl Widget for Button { /* .. */ }

struct Text { /* .. */ }
impl Widget for Text { /* .. */ }
```

Daher muss ein Vektor von Widgets heterogen sein, d. h. er kann Widgets unterschiedlicher Typen enthalten.
Die Optionen 1, 2 und 3 beschränken jede Implementierung von `Widget::render` darauf, einen Vektor eines einzigen Widget-Typs zurückzugeben.
Die Optionen 4 und 5 verwenden dynamischen Dispatch über Trait-Objekte, um heterogene Vektoren von Widgets zu ermöglichen.
"""
id = "0fdd5ca0-835f-4999-8d24-37841cb0a1a7"


[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:** Von `render` sollen nur Typen zurückgegeben werden, die den Trait `Widget` implementieren.
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3", "4", "5"]
context = """
Der Trait `Widget` in Option 2 schränkt nicht ein, dass `Children: Widget` gilt.
Alle anderen Optionen stellen sicher, dass ein `Vec<W>` für ein `W` mit `W: Widget` zurückgegeben wird.
"""
id = "fbed1c75-737c-49f5-8f11-66d25391079b"
