id = "153b12b3-4fbc-449c-99a6-7a2cd469df0f"
type = "Tracing"
prompt.program = """
pub mod point {
  #[derive(Debug)]
  pub struct Point(i32, i32);

  impl Point {
    pub fn origin() -> Self { Point(0, 0) }
  }
}

fn main() {
  let mut p = point::Point::origin();
  p.0 += 1;
  println!("{p:?}");
}
"""
answer.doesCompile = false
answer.lineNumber = 12
context = """
Das Struct `Point` und die statische Methode `origin` sind zwar beide öffentlich, aber das Feld `i32` ist nicht mit pub gekennzeichnet. Daher ist ein direkter Zugriff auf `p.0` außerhalb
des Moduls `point` nicht erlaubt. Dieses Programm würde kompilieren, wenn Zeile 3 zu `pub struct Point(pub i32, pub i32)` geändert würde.
"""