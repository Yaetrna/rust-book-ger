id = "1f4e5c06-ecdf-481d-9cae-8a25dafe9cfd"
type = "MultipleChoice"
prompt.prompt = """
**Programm 2:**

```ide
/// Gets the string out of an option if it exists,
/// returning a default otherwise
fn get_or_default(arg: &Option<String>) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg.unwrap();
    s.clone()
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieser Funktion bekommen würdest?
"""
answer.answer = "cannot move out of `arg` in `arg.unwrap()`"
prompt.distractors = [
  "cannot call `arg.is_none()` without dereferencing `arg`",
  "`arg` does not live long enough",
  "cannot return `s.clone()` which does not live long enough"
]
context = """
Die Funktion `Option::unwrap` erwartet `self`, also die Ownership von `arg`. `arg` ist aber eine unveränderliche
Referenz auf eine Option und kann daher keine Ownership der Option liefern. Deshalb beschwert sich der Compiler, dass wir 
nicht über `unwrap` aus `arg` herausverschieben können.
"""


