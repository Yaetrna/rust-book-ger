[[questions]]
id = "c753bc38-0dc1-44d5-8b06-136fdbbc26d2"
type = "MultipleChoice"
prompt.prompt = """
Welches Profil wird standardmäßig verwendet, wenn du `cargo build` ohne zusätzliche Flags ausführst?
"""
answer.answer = "`dev`"
prompt.distractors = [
    "`release`",
    "`build`",
]
context = """
Um die Kompilierzeiten gering zu halten, ist das Standardprofil `dev`. Füge `--release` hinzu, wenn du das Profil `release`
mit längeren Kompilierzeiten, aber schnellerer Ausführung des Codes willst. (Es gibt kein Profil `build`.)
"""