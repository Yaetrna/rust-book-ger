[[questions]]
id = "2e273ac2-6f06-4c19-a831-1d44eed89323"
type = "MultipleChoice"
prompt.prompt = """
Betrachte die Berechtigungen im folgenden Programm:

```aquascope,permissions,stepper
#fn main() {
let mut s = String::from("Hello");
let t = &mut s;
/* here */
t.push_str(" world");
println!("{}", s);
#}
```

Welche Berechtigungen hat der Pfad `s` an der mit `/* here */` markierten Stelle? Wähle unten jede zutreffende Berechtigung aus oder wähle „Keine Berechtigungen“,
wenn der Pfad keine Berechtigungen hat.
"""
answer.answer = ["Keine Berechtigungen"]
prompt.distractors = ["R", "W", "O"]
prompt.answerIndex = 3
context = """
Der veränderliche Borrow `t = &mut s` entzieht `s` alle Berechtigungen, solange `t` lebendig ist.
"""

[[questions]]
id = "b431f43e-9a6f-4715-ae88-8896fca6ff3b"
type = "MultipleChoice"
prompt.prompt = """
Betrachte die Berechtigungen im folgenden Programm:

```aquascope,permissions,stepper,boundaries
fn get_first(v: &Vec<String>) -> &String {
    &v[0]
}

fn main() {
    let mut strs = vec![
        String::from("A"), String::from("B")
    ];
    let first = get_first(&strs);
    if first.len() > 0 {
        strs.push(String::from("C"));
    }
}
```

Welche der folgenden Aussagen erklärt am besten, warum `strs` die Write-Berechtigung verliert und wieder zurückerhält?
"""
answer.answer = "`get_first` gibt eine unveränderliche Referenz auf Daten innerhalb von `strs` zurück, daher ist `strs` nicht beschreibbar, solange `first` lebendig ist"
prompt.distractors = [
  "`strs` ist nicht beschreibbar, solange die an `get_first` übergebene unveränderliche Referenz `&strs` lebendig ist",
  "`strs` braucht die Write-Berechtigung erst bei der Operation `strs.push(..)`, daher erhält es sie auch erst bei dieser Anweisung zurück",
  "Weil `first` auf `strs` verweist, kann `strs` nur innerhalb eines verschachtelten Gültigkeitsbereichs wie der if-Anweisung verändert werden"
]
context = """
Beim Aufruf von `get_first` erkennt Rust, dass der zurückgegebene String `first` auf Daten innerhalb von `strs` zeigen könnte, daher verliert `strs`
die Write-Berechtigung. Sobald die Variable `first` nicht mehr verwendet wird (nach der if-Bedingung), erhält `strs` die Write-Berechtigung zurück.
"""

[[questions]]
id = "652e596c-7cc9-42e6-a7f8-701879cd9a2b"
type = "MultipleChoice"
prompt.prompt = """
Betrachte dieses unsichere Programm:
```aquascope,interpreter,shouldFail
#fn main() {
let v1 = vec![1, 2, 3];
let mut v2 = v1;
v2.push(4);
println!("{}", v1[0]);`[]`    
#}
```

Welche der folgenden Aussagen beschreibt am besten die Stelle, an der in diesem Programm undefiniertes Verhalten auftritt?
"""
answer.answer = "`v1[0]` liest `v1`, das auf freigegebenen Speicher zeigt"
prompt.distractors = [
  "`v2` besitzt die Vektordaten auf dem Heap, `v1` dagegen nicht",
  "`v1` wurde in Zeile 2 in `v2` verschoben",
  "`v1` hat einen Zeiger, der durch das `push` in Zeile 3 ungültig wird"
]
context = """
Das undefinierte Verhalten entsteht, weil `v1` gelesen wird, nachdem es freigegeben wurde. Die anderen drei Optionen sind zwar zutreffende Aussagen
über das Programm, erklären aber nicht, warum das undefinierte Verhalten tatsächlich auftritt. Würde man zum Beispiel das `println` entfernen,
wären die anderen drei Optionen immer noch wahr, aber das Programm hätte kein undefiniertes Verhalten mehr.
"""