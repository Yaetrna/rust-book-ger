type = "Tracing"
prompt.program = """
enum Location {
  Point(i32),
  Range(i32, i32)
}

fn main() {
  let l: Location = Location::Range(0, 5);
  let n = match l {
    Location::Point(_) => -1,
    Location::Range(_, 5) => 5,
    Location::Range(0, _) => 0,
    _ => -2
  };
  println!("{n}");
}
"""
answer.doesCompile = true
answer.stdout = "5"
context = """ 
Die Arme werden von oben nach unten ausprobiert. Sowohl das zweite als auch das dritte Pattern passen, also wird das zweite verwendet.
"""


[[questions]]
id = "f7c361e0-733a-4d48-9809-736e3c1e2b67"
type = "MultipleChoice"
prompt.prompt = """
Betrachte diese Methode, die für den Typ `Option` implementiert ist:

```
impl<T> Option<T> {
  fn unwrap_or(self, other: T) -> T {
    match self {
      Some(t) => t,
      None => other
    }
  }
}
```

Welcher Satz beschreibt das Verhalten dieser Funktion am besten?
"""
answer.answer = "Gibt das Objekt in `self` zurück, falls vorhanden, und andernfalls `other`"
prompt.distractors = [
  "Gibt eine neue Option zurück, die das Objekt in `self` enthält, falls vorhanden, und andernfalls `other`",
  "Fügt `other` in `self` ein, falls `self` noch keinen Wert enthält",
  "Gibt eine Referenz auf das Objekt in `self` zurück, falls vorhanden, und andernfalls `other`"
]
context = """
Diese Funktion „packt“ die Option „aus“ (*unwrap*), indem sie ihre Ownership übernimmt und den Wert darin herausholt; ist kein Wert vorhanden, gibt sie ersatzweise `other` zurück.
Diese Funktion gibt es tatsächlich in der Standardbibliothek!
"""


