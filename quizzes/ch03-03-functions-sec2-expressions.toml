prompt.prompt = """
In Rust ist ein Block in geschweiften Klammern wie `{ /* ... */ }`:
1. ein Ausdruck
2. eine Anweisung
3. ein syntaktischer Gültigkeitsbereich
"""
answer.answer = "1 und 3"
prompt.distractors = [ "nur 1", "nur 2", "2 und 3" ]
context = """
Ein Block ist ein Ausdruck (#1), der Anweisungen enthalten darf. Außerdem definiert er einen syntaktischen Gültigkeitsbereich für die let-Bindungen darin (#3).
"""

