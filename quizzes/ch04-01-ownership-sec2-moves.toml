[[questions]]
id = "889ca9ac-0f4b-4abf-82c4-be9cd4d4f7ad"
type = "MultipleChoice"
prompt.prompt = "Welche der folgenden Situationen ist KEINE Form von undefiniertem Verhalten?"
answer.answer = "Einen Zeiger auf freigegebenen Speicher in einem Stack-Frame haben"
prompt.distractors = [
  "Einen Zeiger verwenden, der auf freigegebenen Speicher zeigt",
  "Denselben Speicher ein zweites Mal freigeben",
  "Einen nicht-booleschen Wert als `if`-Bedingung verwenden"
]
context = """
Einen Zeiger auf freigegebenen Speicher in einem Stack-Frame zu haben, kann völlig sicher sein. 
Wichtig ist nur, diesen Zeiger nicht mehr zu *verwenden*, z. B. indem man ihn liest oder freigibt.
"""

[[questions]]
id = "94425a4e-043e-47f8-9fba-c5b09fb60aa3"
type = "Tracing"
prompt.program = """
fn add_suffix(mut s: String) -> String {
  s.push_str(" world");
  s
}

fn main() {
  let s = String::from("hello");
  let s2 = add_suffix(s);
  println!("{}", s2);
}
"""
answer.doesCompile = true
answer.stdout = "hello world"
context = """
Dieses Programm ist gültig, weil `s` nicht mehr verwendet wird, nachdem es in `add_suffix` verschoben wurde.
"""

[[questions]]
id = "c00e3638-861b-4f9e-a55c-bfb67af79280"
type = "Tracing"
prompt.program = """
fn main() {
  let s = String::from("hello");
  let s2;
  let b = false;
  if b {
    s2 = s;
  }
  println!("{}", s);
}
"""
answer.doesCompile = false
answer.lineNumber = 8
context = """
Weil `s` innerhalb der if-Anweisung verschoben werden könnte, ist es nicht erlaubt, es in Zeile 8 zu verwenden.
Zwar wird die if-Anweisung in diesem Programm nie ausgeführt, weil `b` immer `false` ist,
aber Rust versucht im Allgemeinen nicht zu ermitteln, ob if-Anweisungen ausgeführt werden oder nicht. Rust geht einfach
davon aus, dass sie ausgeführt werden *könnte*, und `s` deshalb verschoben werden *könnte*.
"""

[[questions]]
id = "f7d67c11-60bb-4d92-8cc2-8ce82cf4c974"
type = "MultipleChoice"
prompt.prompt = """
Angenommen, wir haben eine Funktion, die eine Box verschiebt, etwa so:
```
fn move_a_box(b: Box<i32>) {
  // This space intentionally left blank
}
```

Unten stehen vier Codeausschnitte, die der Rust-Compiler zurückweist. 
Stell dir vor, Rust würde diese Codeausschnitte stattdessen kompilieren und ausführen lassen. 
Wähle jeden Codeausschnitt aus, der undefiniertes Verhalten verursachen würde, oder wähle 
„Keiner dieser Codeausschnitte“, wenn keiner davon undefiniertes Verhalten verursachen würde.
"""
answer.answer = [
"""
```
let b = Box::new(0);
let b2 = b;
move_a_box(b);
```
""",
"""
```
let b = Box::new(0);
move_a_box(b);
println!("{}", b);
```
""",
"""
```
let b = Box::new(0);
move_a_box(b);
let b2 = b;
```
"""
]
prompt.distractors = [
"""
```
let b = Box::new(0);
let b2 = b;
println!("{}", b);
move_a_box(b2);
```
""",
"Keiner dieser Codeausschnitte"
]
context = """
Der entscheidende Gedanke ist: Wenn eine Box an `move_a_box` übergeben wird, wird ihr Speicher freigegeben, sobald `move_a_box` endet.
Daher gilt:
* `b` nach `move_a_box` mit `println` zu lesen, ist undefiniertes Verhalten, weil dabei freigegebener Speicher gelesen wird.
* `b` einen zweiten Owner zu geben, ist undefiniertes Verhalten, weil Rust die Box dann ein zweites Mal für `b2` freigeben würde. Dabei spielt es keine Rolle, ob die Bindung `let b2 = b`
  vor oder nach `move_a_box` stattfindet.

`let b2 = b` und danach `println` ist dagegen kein undefiniertes Verhalten. Obwohl `b` verschoben wird, werden seine Daten erst freigegeben, wenn am Ende `move_a_box` aufgerufen wird. Daher 
ist dieses Programm technisch gesehen sicher, auch wenn Rust es trotzdem zurückweist.
"""
