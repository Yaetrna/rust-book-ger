[[questions]]
id = "c5b27431-c318-4243-9621-cadacb737f5a"
type = "MultipleChoice"
prompt.prompt = """
Wahr oder falsch: Dieser Code terminiert (läuft also nicht endlos in einer Schleife).

```
fn main() {
    let mut x = 0;
    'a: loop {
        x += 1;
        'b: loop {
            if x > 10 {
                continue 'a;
            } else {
                break 'b;
            }      
        }
        break;       
    }
}
```
"""
answer.answer = "Wahr"
prompt.distractors = [ "Falsch" ]
context = """
Er terminiert tatsächlich schon nach der ersten Iteration der Schleife.
"""

[[questions]]
id = "46a52842-d4eb-4dc9-8885-f31a2f2f59b4"
type = "Tracing"
prompt.program = """
fn main() {
    let a = [5; 10];
    let mut sum = 0;
    for x in a {
        sum += x;
    }
    println!("{sum}");
}
"""
answer.doesCompile = true
answer.stdout = "50"
context = """
Das Array `a` enthält das Element `5` zehnmal, daher ist seine Summe `50`. Die Antwort ist nicht `15` – beachte, dass sich die Syntax `[5; 10]` von `[5, 10]` unterscheidet.
"""