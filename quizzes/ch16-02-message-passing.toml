[[questions]]
id = "5b117680-87a5-4b18-abba-3415602477eb"
type = "Tracing"
prompt.program = """
use std::{sync::mpsc, thread};

enum ClientMessage { Incr, Get, Quit }
enum ServerMessage { Get(usize) }

fn main() {
    let (server_tx, client_rx) = mpsc::channel();
    let (client_tx, server_rx) = mpsc::channel();
    let server = thread::spawn(move || {
        let mut n = 0;
        loop {
            match server_rx.recv().unwrap() {
                ClientMessage::Quit => break,
                ClientMessage::Incr => n += 1,
                ClientMessage::Get => server_tx.send(ServerMessage::Get(n)).unwrap()
            }
        }
    });

    for msg in [ClientMessage::Incr, ClientMessage::Get, ClientMessage::Quit] {
        client_tx.send(msg).unwrap();
    }

    if let ServerMessage::Get(n) = client_rx.recv().unwrap() {
        println!("{}", n)
    }

    server.join().unwrap();
}

"""
answer.doesCompile = true
answer.stdout = "1"
context = """
Das ist ein Beispiel dafür, wie man mit Enums verschiedene Arten von Nachrichten über einen Kanal sendet.
Hier erhöht der Client eine Zahl, ruft die Zahl ab und beendet dann den Server.
"""

[[questions]]
id = "94934f0f-4db9-48ee-b63e-198ad1a9ffc8"
type = "Tracing"
prompt.program = """
use std::{sync::mpsc, thread};

fn main() {
    let (tx, rx) = mpsc::channel();
    thread::spawn(move || {
        let s = String::from("Hello world");
        tx.send(s.clone()).unwrap();
        tx.send(s.len()).unwrap();
    });
    let s = rx.recv().unwrap();
    let n = rx.recv().unwrap();
    println!("{s} {n}");
}
"""
answer.doesCompile = false
answer.lineNumber = 8
context = """
Kanäle können nur Werte eines einzigen Typs senden, daher ist `tx.send(s.len())` ein Typfehler.
Willst du Werte mehrerer Typen senden, kannst du entweder ein Enum oder den 
Trait [`Any`](https://doc.rust-lang.org/std/any/trait.Any.html) verwenden.
"""