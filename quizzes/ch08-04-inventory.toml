let x = &v[0];
reverse(&mut v);
println!("{x}");
```
""",
"""
```
let mut v = vec![String::from("a"), String::from("b")];
reverse(&mut v);
```
""",
"""
```
let mut v = vec![String::from("a"), String::from("b")];
reverse(&mut v);
println!("{:?}", v);
```
""",
]
context = """
Diese Funktion kann keine Verletzung der Speichersicherheit verursachen, weil für alle `i` gilt: `i != n - i - 1`. Die beiden
veränderlichen Referenzen verweisen also immer auf verschiedene Elemente. Beachte, dass das Programm mit `let x = &v[0]` nicht
kompilieren würde, weil der Borrow-Checker von Rust nicht erlauben würde, `reverse` aufzurufen, solange `x` aktiv ist.
"""

