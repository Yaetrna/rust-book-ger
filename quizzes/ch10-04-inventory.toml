id = "d070eb9e-4527-453a-8c9b-698739a3dd6a"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

Welche der folgenden Korrekturen (gelb hervorgehoben) erfüllt diese drei Kriterien am besten:
1. Die korrigierte Funktion besteht den Rust-Compiler,
2. die korrigierte Funktion bewahrt die Absicht des ursprünglichen Codes und
3. die korrigierte Funktion führt keine unnötigen Ineffizienzen ein?
"""
answer.answer = """
```ide
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    `[let mut elem_refs: Vec<&T> = elems.iter().collect();]`
    `[elem_refs.sort();]`
    let t = `[elem_refs[n]]`;
    return t.clone();
}
```
"""
prompt.distractors = [
"""
```ide
fn find_nth<T: Ord + Clone>(`[elems: &mut [T]]`, n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```
""",
"""
```ide
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    `[let mut elems = elems.to_vec();]`
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```
""",
"""
```ide
fn find_nth<`[T: Ord]`>(`[mut elems: Vec<T>]`, n: usize) -> T {
    elems.sort();
    let t = `[elems.remove(n)]`;
    return `[t]`;
}
```
""",
]
context = """
Eine Funktion wie `find_nth` ist offensichtlich als rein lesende Funktion gedacht, d. h., sie soll
eine Information über die Eingabefolge ermitteln. Jede Lösung, die die Eingabe verändert oder verwirft, bewahrt daher nicht die Absicht der ursprünglichen Funktion, selbst wenn
sie effizienter ist, als einen Hilfsvektor anzulegen. 

Einen `Vec<&T>` anzulegen ist besser, als einen `Vec<T>` anzulegen, denn wenn `T` groß ist, könnte
`elems.to_vec()` teuer sein. Wüssten wir dagegen, dass `T: Copy` gilt, wäre `to_vec`
vorzuziehen, um die Zahl der Zeiger-Dereferenzierungen in `elems.sort()` zu verringern.
"""

