[[questions]]
id = "867e5d29-c1eb-44b3-99e3-bb2325b74e44"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Removes all the zeros in-place from a vector of integers.
fn remove_zeros(v: &mut Vec<i32>) {
    for (i, t) in v.iter().enumerate().rev() {
        if *t == 0 {
            v.remove(i);
            v.shrink_to_fit();
        }
    }
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieser Funktion bekommen würdest?
"""
answer.answer = "`v.remove(i)` cannot borrow `v` as mutable"
prompt.distractors = [
  "`v` does not live long enough to call `v.remove(i)`",
  "`t` cannot be dereferenced while `i` is live",
  "`v.iter()` cannot be called on a mutable reference"
]
context = """
Die Funktion `v.iter()` leiht einen Vektor `v` für die Dauer der for-Schleife unveränderlich aus (*borrows*). `v.remove(i)` braucht jedoch eine veränderliche
Referenz auf `v`. Daher kann `v.remove(i)` `v` nicht veränderlich ausleihen, weil das mit dem Iterator in Konflikt stünde.
"""


