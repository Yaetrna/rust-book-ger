context = """
Jede Strategie, die einen neuen Vektor alloziert, ob mit `Vec::clone` oder `Vec::new`, erfordert eine unnötige zusätzliche Allokation.
Die einfachste funktionierende Strategie ist daher, nur über die Indizes `0 .. v.len()` zu iterieren, was `v` nicht ausleiht. Wir tun das
in umgekehrter Reihenfolge, damit wir keine Indizes entfernen, die es nicht mehr gibt.

Wie bei Problem 1 ist die idiomatischste Strategie eigentlich eine eingebaute Funktion, die wir noch nicht besprochen haben:
[`Vec::retain`](https://doc.rust-lang.org/std/vec/struct.Vec.html#method.retain). Diese Funktion behält in einem Vektor nur die Elemente,
die ein Prädikat erfüllen, und geht dabei sparsamer mit Speicher um.
"""

