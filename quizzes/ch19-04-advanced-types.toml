[[questions]]
id = "d3d9197f-8baf-4ec5-9988-282c67636d3c"
type = "Tracing"
prompt.program = """
fn expect_none(x: Option<i32>) -> ! {
    match x {
        Some(n) => panic!("Expected none, found Some({n})"),
        None => ()
    }
}

fn main() {
    println!("{:?}", expect_none(None));
}
"""
answer.doesCompile = false
answer.lineNumber = 4
context = """
Der Typ `!` ist kein geeigneter Rückgabetyp für diese Funktion, weil sie nur manchmal einen Panic auslöst,
nicht immer.
"""

[[questions]]
id = "5c5cb765-a561-459f-8223-9e72e824c5da"
type = "Tracing"
prompt.program = """
fn is_equal<T: Eq>(t1: &T, t2: &T) -> bool {
  t1 == t2
}

fn main() {
  println!("{}", is_equal("Hello", "world"));
}

"""
answer.doesCompile = false
answer.lineNumber = 6
context = """
Der Aufruf von `is_equal` übergibt Werte vom Typ `&str`. Das bedeutet `T = str`. `str`
darf in einer solchen generischen Funktion jedoch nur verwendet werden, wenn `T` als `?Sized` gekennzeichnet ist.
"""
