id = "dcfd54f8-7fe6-4483-aefd-ea95ba5b5eb0"
type = "MultipleChoice"
prompt.prompt = """
Die Funktion `transfer_string` wird vom Borrow-Checker zurückgewiesen:

```rust
fn get_first(strs: &mut (String, String)) -> &mut String {
    &mut strs.0
}

fn get_second(strs: &mut (String, String)) -> &mut String {
    &mut strs.1
}

fn transfer_string(strs: &mut (String, String)) {
    let fst = get_first(strs);
    let snd = get_second(strs);
    fst.push_str(snd);
    snd.clear();
}
```

Stell dir vor, der Borrow-Checker würde diese Funktion nicht zurückweisen. 
Bestimme, ob es eine Eingabe gibt, bei der die Funktion undefiniertes Verhalten verursachen würde, wenn sie mit dieser Eingabe ausgeführt wird.
"""
answer.answer = "Diese Funktion könnte KEIN undefiniertes Verhalten verursachen"
prompt.distractors = ["Diese Funktion KÖNNTE undefiniertes Verhalten verursachen"]
context = """
Der Borrow-Checker weist diese Funktion zurück, weil er annimmt, dass `get_first` und `get_second` eine veränderliche
Referenz auf jede der beiden Komponenten des Tupels zurückgeben könnten, sodass `fst` und `snd` möglicherweise auf denselben Wert zeigen. In diesem Programm
sind sie aber immer verschieden, also ist diese Funktion tatsächlich sicher.
"""



