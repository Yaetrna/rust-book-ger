id = "6e5e193e-579d-4a46-aae4-d35336b77b68"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Makes a string to separate lines of text, 
/// returning a default if the provided string is blank
fn make_separator(user_str: &str) -> &str {
    if user_str == "" {
        let default = "=".repeat(10);
        &default
    } else {
        user_str
    }
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieser Funktion bekommen würdest?
"""
answer.answer = "cannot return reference to local variable `default`"
prompt.distractors = [
  "`user_str` does not live long enough",
  "function `make_separator` cannot return a reference of type `&str`",
  "function `make_separator` cannot return two different references"
]
context = """
Weil `default` innerhalb von `make_separator` auf dem Stack lebt, wird es freigegeben, sobald ein Aufruf von `make_separator` endet.
Dann zeigt `&default` auf freigegebenen Speicher. Rust beschwert sich deshalb, dass man keine Referenz auf eine lokale Variable zurückgeben kann.
"""

