id = "95979d75-5823-4059-a1cf-7e0eba69b41a"
type = "MultipleChoice"
prompt.prompt = """
**Programm 2:**

```ide
struct TestResult {
    /// Student's scores on a test
    scores: Vec<usize>,

    /// A possible value to curve all scores
    curve: Option<usize>
}
impl TestResult {  
    pub fn get_curve(&self) -> &Option<usize> { 
        &self.curve 
    }

    /// If there is a curve, then increments all 
    /// scores by the curve
    pub fn apply_curve(&mut self) {
        if let Some(curve) = self.get_curve() {
            for score in self.scores.iter_mut() {
                *score += *curve;
            }
        }
    }
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieses Programms bekommen würdest?
"""
answer.answer = "in `apply_curve`, cannot borrow `self.scores` as mutable for `iter_mut`"
prompt.distractors = [
  "in `get_curve`, cannot return a reference to a local variable `self.curve`",
  "in `apply_curve`, cannot borrow `self` as immutable for `get_curve`",
  "in `apply_curve`, `*score` cannot be mutated"
]
context = """
Wegen der Lifetime-Elision hat die Funktion `get_curve` die Typsignatur `get_curve<'a>(&'a self) -> &'a Option<usize>`. 
Das bedeutet, dass ein Aufruf von `self.get_curve()` die Ausleihe auf ganz `self` ausdehnt, nicht nur auf `self.curve`.
Daher ist `self` im Gültigkeitsbereich von `let Some(curve) = ...` unveränderlich ausgeliehen, und `self.scores.iter_mut()`
kann nicht aufgerufen werden.
"""


