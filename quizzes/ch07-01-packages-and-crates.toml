[[questions]]
id = "904a0808-22d1-45e5-9611-cf143babbc41"
type = "MultipleChoice"
prompt.prompt = """
Welche Reihenfolge ist richtig, wenn „A > B“ bedeutet „A enthält B“?
"""
answer.answer = "Paket > Crate > Modul"
prompt.distractors = [ "Modul > Crate > Paket", "Crate > Paket > Modul" ]
context = """
Ein Paket ist die oberste Organisationseinheit und enthält Crates. Ein Crate enthält Module.
"""

[[questions]]
id = "d45c7cbe-6089-40b9-843c-fbb9ff48ca49"
type = "ShortAnswer"
prompt.prompt = """
Stell dir vor, du siehst ein Rust-Paket `foobar` mit folgenden Dateien:

```text
foobar
├── Cargo.toml
├── build.rs
└── src/
    ├── main.rs
    ├── util.rs
    ├── lib.rs
    └── bin/
        └── alt.rs
```

Wie viele Crates enthält dieses Paket? Gib deine Antwort als Ziffer an, z. B. 0, 1 und so weiter.
"""
answer.answer = "3"
context = """ 
`main.rs` erzeugt ein Binary-Crate, `lib.rs` ein Library-Crate und `bin/alt.rs` ein Binary-Crate. `util.rs` würde vermutlich als Modul innerhalb
eines dieser Crates verwendet, ist aber kein besonderer Dateiname, den Rust erkennt, und wäre daher kein eigenes Crate. `build.rs` ist ein Build-Skript.
"""
