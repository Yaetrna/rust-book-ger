[[questions]]
id = "9ff33b87-38e2-471b-8ca4-9c31a6431376"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

Welche der folgenden Fehlermeldungen beschreibt am besten den Compilerfehler, den du beim Kompilieren dieses Programms bekommen würdest?
"""
answer.answer = "cannot borrow `elems` as mutable for `sort`"
prompt.distractors = [
  "cannot move out of shared reference for `clone`",
  "cannot move out of shared reference in expression `&elems[n]`",
  "the lifetime of `T` must outlive `&[T]`",
]
context = """
Die Methode `slice::sort` erwartet eine veränderliche Referenz auf einen Slice,
bekommt aber eine unveränderliche Referenz.
"""


[[questions]]
id = "3ee8d846-d282-4de1-8e83-5ca0bc44fc13"
type = "MultipleChoice"
prompt.prompt = """
**Programm 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

Wenn du versuchst, diese Funktion zu kompilieren, gibt der Compiler normalerweise folgenden Fehler aus:

```text
error[E0596]: cannot borrow `*elems` as mutable, as it is behind a `&` reference
 --> test.rs:3:5
  |
3 |     elems.sort();
  |     ^^^^^^^^^^^^ `elems` is a `&` reference, so the data it refers to cannot be borrowed as mutable
```

Nimm an, der Compiler würde diese Funktion NICHT zurückweisen. Welche (falls überhaupt) der folgenden Programme würden
(1) den Compiler passieren und (2) bei der Ausführung möglicherweise undefiniertes Verhalten verursachen?
Wähle jedes Programm aus, das beide Kriterien erfüllt, ODER wähle „Keines dieser Programme“, wenn keines sie erfüllt.
"""
answer.answer = ["Keines dieser Programme"]
prompt.distractors = [
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 10);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 0);
println!("{}", v[0]);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
let n = &v[0];
find_nth(&v, 0);
println!("{}", n);
```
""",
]
context = """
Dieses Programm ist technisch speichersicher, weil `slice::sort` Elemente nur umherschieben,
aber nicht freigeben kann. So zeigt `&v[0]` nach dem Aufruf von `find_nth` garantiert auf 
*irgendeine* Zahl, auch wenn es nicht die *ursprüngliche* Zahl ist.

Beachte, dass `find_nth(&v, 10)` kein undefiniertes Verhalten verursacht, weil Rust Zugriffe auf Arrays
prüft; die Auswertung von `&v[10]` löst daher einen Panic aus.
"""


