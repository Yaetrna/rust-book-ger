[multipart]
q = """
**Kontext:** Du entwirfst einen einfachen Asset-Manager für eine Spiel-Engine.

**Funktionalität:** Ein Nutzer der API gibt Pfade von zu ladenden Assets an und erhält Zugriff auf die geladenen Assets.

**Annahmen:** Du kannst davon ausgehen, dass Ladevorgänge synchron und ohne Verzögerung erfolgen.

**Designs:** Unten stehen mehrere vorgeschlagene Designs, um die Funktionalität zu implementieren.

```
pub struct AssetManager {
    // ...
}

// Option 1: return a reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &Asset;
}

// Option 2: return a mutable reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &mut Asset;
}

// Option 3: return a reference-counted pointer
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> Rc<Asset>;
}

// Option 4: return a copyable handle that can be turned into a reference
#[derive(Copy, Clone)]
pub struct AssetHandle(usize);

impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> AssetHandle;
    pub fn get(&self, handle: AssetHandle) -> &Asset;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:** Ein einmal geladenes Asset soll dauerhaft unveränderlich (_immutable_) sein.
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3", "4"]
context = """
Die Unveränderlichkeit von Assets wird durch Typen durchgesetzt, die keine verändernden Operationen erlauben. Sowohl eine unveränderliche Ausleihe `&Asset`
als auch ein unveränderlicher Smart-Pointer wie `Rc` erlauben keine verändernden Operationen. Daher ERFÜLLEN die Optionen 1, 3 und 4 diese Anforderung.
Option 2 gibt eine veränderliche Ausleihe zurück, was die Anforderung NICHT erfüllt.
"""
id = "10ae140e-72a6-4594-802a-d656f33cd836"


[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:**  Nutzer des Asset-Managers müssen den Zugriff auf Assets über mehrere kurzfristige Ausleihen des Asset-Managers hinweg behalten.
"""
prompt.distractors = ["1", "2"]
prompt.sortAnswers = true
answer.answer = ["3", "4"]
context = """
„Zugriff über Ausleihen hinweg behalten“ bedeutet, dass der Nutzer ein Programm wie dieses schreiben möchte:

```
let asset = {
    let manager = get_manager();
    manager.load("some/path")
};
process_asset(asset);
let another_asset = {
    let manager = get_manager();
    manager.load("another/path")
};
```

In diesem Fall darf die Lifetime des von `load` zurückgegebenen Werts nicht an die Lifetime des `AssetManager` gebunden sein. Die Optionen 1 und 2
verlangen, dass `&Asset` und `&mut Asset` nur so lange leben wie `&mut self`. Daher würde der Borrow-Checker
Programme wie das obige zurückweisen, in denen ein Asset länger lebt als die Referenz auf den Manager. Die Optionen 1 und 2 erfüllen die Anforderung NICHT.

Die Optionen 3 und 4 ERFÜLLEN die Anforderung. Die Lifetime von `Rc<Asset>` ist nicht an die Lifetime von `&mut self` gebunden. Ebenso ist die Lifetime
von `AssetHandle` nicht an die Lifetime von `&mut self` gebunden.
"""
id = "b69cde98-8ccd-4a89-aeeb-80a3338f9e68"


[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
Wähle jede Design-Option aus, die die folgende Anforderung erfüllt:

**Anforderung:** Es ist wichtig, dass alle Assets zu einem einzigen, vorhersehbaren Zeitpunkt freigegeben werden.
"""
prompt.distractors = ["3"]
prompt.sortAnswers = true
answer.answer = ["1", "2", "4"]
context = """
Um alle Assets zu einem einzigen Zeitpunkt freizugeben, muss der `AssetManager` die alleinige Ownership an ihnen behalten.
Wenn der `AssetManager` dann verworfen (_dropped_) wird (oder auf andere Weise angewiesen wird, Assets freizugeben),
ist garantiert, dass alle Assets sicher verworfen werden können.
Die Optionen 1, 2 und 4 ERFÜLLEN diese Anforderung. Option 4 würde verlangen, dass `AssetManager::get` einen Panic auslöst, wenn
der Nutzer `manager.get(handle)` aufruft, nachdem ein Asset freigegeben wurde. Wenn ernsthaft damit zu rechnen ist, dass ein Nutzer das tut,
wäre eine weitere Alternative, dass `get` ein `Option<&Asset>` zurückgibt.

Option 3 erfüllt diese Anforderung NICHT. Zeiger mit Referenzzählung gehören gemeinsam allen Ownern eines `Rc<Asset>`.
Der `AssetManager` hat keine gute Möglichkeit sicherzustellen, dass zum Zeitpunkt der Freigabe keines der Assets andere Owner hat.
"""
id = "48527488-ecfc-4f16-9824-76a3ac7183f4"
