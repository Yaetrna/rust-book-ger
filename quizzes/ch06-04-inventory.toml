id = "3a8d5bb8-a204-43e6-b50a-d17c803dbe37"
type = "MultipleChoice"
prompt.prompt = """
**Programm 2:**

```ide
/// Gets the string out of an option if it exists,
/// returning a default otherwise
fn get_or_default(arg: &Option<String>) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg.unwrap();
    s.clone()
}
```

Welche der folgenden Korrekturen (gelb hervorgehoben) erfüllt diese drei Kriterien am besten:
1. Die korrigierte Funktion besteht den Rust-Compiler,
2. die korrigierte Funktion bewahrt die Absicht des ursprünglichen Codes und
3. die korrigierte Funktion führt keine unnötigen Ineffizienzen ein?
"""
answer.answer = """
```ide
fn get_or_default(arg: &Option<String>) -> String {
    `[match arg {]`
        `[None => String::new(),]`
        `[Some(s) => s.clone()]`
    `[}]`
}
```
"""
prompt.distractors = [
"""
```ide
fn get_or_default(arg: `[&mut Option<String>]`) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg`[.as_mut()]`.unwrap();
    s.clone()
}
```
""",
"""
```ide
fn get_or_default(arg: `[Option<String>]`) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg.unwrap();
    s.clone()
}
```
""",
"""
```ide
fn get_or_default(arg: &Option<`[&str]`>) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg.unwrap();
    `[s.to_string()]`
}
```
""",
]
context = """
Die Kombination aus `is_none` und `unwrap` ist hier ein Anti-Pattern in Rust, weil ein `match` beide Funktionalitäten vereint und
automatisch die Referenz `&Option` nach innen schiebt, sodass ein `&String` entsteht. Deshalb ist die `match`-Lösung
die idiomatischste und besteht den Compiler, ohne die beabsichtigte Typsignatur der Funktion zu ändern.

Die Lösung, `&Option` in `Option` zu ändern, ist nicht wünschenswert, weil die aufrufende Stelle dann die Ownership ihrer Option abgeben muss,
was eine weitaus restriktivere API ist.
"""